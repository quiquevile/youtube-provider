[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-song-provider"
version = "0.1.0"
description = "Self-hosted YouTube SongProvider v0 service"
readme = "README.md"
license = "ISC"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "yt-dlp>=2026.10.21",
  "yt-dlp-ejs>=0.8",
  "argon2-cffi>=23,<26",
  "regex>=2024.0",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "coverage[toml]>=7,<8"]

[project.scripts]
youtube-song-provider = "youtube_provider.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
youtube_provider = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["youtube_provider"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]
