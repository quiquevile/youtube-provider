services:
  provider:
    build: .
    init: true
    ports:
      - "127.0.0.1:3030:3030"
      - "127.0.0.1:3031:3031"
    environment:
      YSP_DATA_DIR: /data
      YSP_OUTPUT_ROOT: /media
      YSP_API_HOST: 0.0.0.0
      YSP_ADMIN_HOST: 0.0.0.0
    volumes:
      - provider-state:/data
      - provider-media:/media
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

volumes:
  provider-state:
    name: youtube-provider-state
  provider-media:
    name: youtube-provider-media
