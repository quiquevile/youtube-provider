<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create admin password · YouTube Provider</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <main>
    <h1>Create admin password</h1>
    <form method="post" action="/setup" class="panel">
      <!-- validation -->
      <label>New password (at least 12 characters)
        <input type="password" name="password" autocomplete="new-password" minlength="12" required autofocus>
      </label>
      <label>Confirm password
        <input type="password" name="confirm" autocomplete="new-password" minlength="12" required>
      </label>
      <div class="actions"><button type="submit">Save and sign in</button></div>
    </form>
  </main>
</body>
</html>
