name: CI

on:
  push:
    branches: [develop, release, main]
    tags: ['v*.*.*', '*.*.*']
  pull_request:
    branches: [develop, release, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY_IMAGE: quiquevile/youtube-provider

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check administration JavaScript syntax
        run: node --check src/youtube_provider/static/admin.js
      - name: Test with coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report -m --fail-under=80
      - name: Build Python wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify release tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${RELEASE_TAG#v}"
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$tag_version" != "$version" ]]; then
            echo "Tag '$RELEASE_TAG' must match pyproject.toml version '$version' (X.Y.Z or vX.Y.Z)" >&2
            exit 1
          fi

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    strategy:
      matrix:
        include:
          - pair: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - pair: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.pair }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/setup-python@v5
        if: github.ref == 'refs/heads/release'
        with:
          python-version: '3.13'
      - name: Release version from pyproject.toml
        if: github.ref == 'refs/heads/release'
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          else
            echo "pyproject.toml version '$version' is not strict X.Y.Z; skipping version tag"
            echo "RELEASE_VERSION=" >> "$GITHUB_ENV"
          fi
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=release,enable=${{ github.ref == 'refs/heads/release' }}
            type=raw,value=release-${{ env.RELEASE_VERSION }},enable=${{ github.ref == 'refs/heads/release' && env.RELEASE_VERSION != '' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)
      - name: Inspect image
        run: docker buildx imagetools inspect "$REGISTRY_IMAGE:${{ steps.meta.outputs.version }}"
